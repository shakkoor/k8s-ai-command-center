name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install flask flask-cors requests google-generativeai groq kubernetes pyyaml pytest pytest-cov python-dotenv

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
        sudo install kubectl /usr/local/bin/kubectl

    - name: Run tests with coverage
      env:
        GROQ_API_KEY: test-key-for-ci
        OPENROUTER_API_KEY: test-key-for-ci
      run: |
        python -m pytest tests/test_backend.py -v --cov=backend --cov-report=term-missing

    - name: Validate Helm charts
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm lint helm-charts/nginx-app
        helm lint helm-charts/flask-backend
        helm lint helm-charts/react-frontend
